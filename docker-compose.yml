services:
  db:
    image: mysql
    container_name: mysql_db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: memo
      MYSQL_USER: guest
      MYSQL_PASSWORD: 1234
    volumes:
      - mysql-vol:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - my-net

  app:
    build: ./app
    container_name: fastapi_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./app:/app
    environment:
      AI_GPT_KEY: ${AI_GPT_KEY}
      DATABASE_URL: "mysql+pymysql://root:1234@db:3306/memo"
    networks:
      - my-net
    depends_on:
      - db

  proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./proxy/web.conf:/etc/nginx/conf.d/default.conf
    networks:
      - my-net
    depends_on:
      - app

networks:
  my-net:
    driver: bridge

volumes:
  mysql-vol: