name: Push 기반 CI/CD 테스트

# 트리거 지정, CI/CD가 작동하게 되는 원인, 이벤트 정의 -> on 정의
# main 브런치에서 사용자가 push의 행위를 실행하면 -> 트리거가 발동 -> 아래 설정한 내용 작동(CI/CD)
on:
    push: 
        branches:
            - main

# 개별작업(파이프라인)
jobs:
    # ci작업(이름)
    ci:
        # 어떤 작업을 수행하려면, 머신, os등 필요 -> 머신 Github Action 제공(무료), os 지정
        runs-on: ubuntu-latest

        # 세부작업 지정
        steps:
            # 1. githbu에 저장되어있는 최신 내용을 체크아웃(소스코드 모두 다운로드)
            - name: 코드 checkout
              uses: actions/checkout@v3

            # 2. checkout 여부 검증
            - name: 소스코드 확인검증
              # 여러개의 리눅스 명령을 활용 => | 활용
              run:  |
                pwd
                ls -al
                cat main.py
              shell: bash